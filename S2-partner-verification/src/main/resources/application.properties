spring.application.name=lbos-partner
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://10.23.240.29:5432/Commerce_Operations_Control_Tower_db}
spring.datasource.username=${DB_USERNAME:Commerce_Operations_Control_Tower_user}
spring.datasource.password=${DB_PASSWORD:Tower_Tata@123}
spring.datasource.driver-class-name=org.postgresql.Driver
# Explicit HikariCP tuning - see S1's application.properties for the full rationale (6 services on
# one Postgres instance were reserving 60 of its 100 max_connections at idle under the untuned
# defaults). maximum-pool-size unchanged at 10 (no evidence of exhaustion); minimum-idle lowered so
# an idle service gives connections back; leak-detection-threshold added as a diagnostic only.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Shared with S1 (issues the JWT) and every other service that validates it
app.jwt.secret=${JWT_SECRET:lbos-dev-shared-jwt-signing-secret-change-in-production-32bytes}

# Shared HTTP Basic credential for /internal/** service-to-service calls
app.security.service.password=${SERVICE_PASSWORD:service123}

# Verification document file storage
app.storage.documents-max-file-size-bytes=10485760

# Multipart upload limits (must be >= app.storage.documents-max-file-size-bytes above)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Register under localhost, same as S1/S4/S5/S6 (see S4's application.properties for the full
# reason): without this, this machine's multiple network adapters can make Eureka publish an
# unreachable address, so every Gateway/Feign call into this service hangs until it times out.
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# Fail fast on service-to-service calls. Feign's defaults (10s connect / 60s read) let a single
# unreachable or slow dependency stall a whole request chain for minutes; a healthy local call
# answers in milliseconds, so these limits only ever cut off calls that were already stuck.
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=30000
