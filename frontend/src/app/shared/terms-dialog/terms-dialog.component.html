<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4" (click)="dismiss()">
  <div class="card w-full max-w-2xl max-h-[85vh] flex flex-col" (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between gap-3 p-5 border-b border-slate-100">
      <div>
        <h2 class="text-base font-semibold text-slate-800 m-0">Terms and Conditions</h2>
        <p class="mt-1 text-xs text-slate-500">{{ lastUpdated }}</p>
      </div>
      <button type="button" class="btn-icon !w-8 !h-8 shrink-0" aria-label="Close" (click)="dismiss()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="p-5 overflow-y-auto text-sm text-slate-600">
      @for (section of sections; track section.heading) {
        <section class="mb-4 last:mb-0">
          <h3 class="text-sm font-semibold text-slate-800 mb-1">{{ section.heading }}</h3>
          @for (paragraph of section.paragraphs; track paragraph) {
            <p class="mb-2 last:mb-0 leading-relaxed">{{ paragraph }}</p>
          }
        </section>
      }
    </div>

    <div class="flex justify-end p-5 pt-0">
      <button type="button" class="btn-primary" (click)="dismiss()">Close</button>
    </div>
  </div>
</div>
