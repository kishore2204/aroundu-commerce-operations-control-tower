<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4" (click)="dismiss()">
  <div class="card w-full max-w-lg max-h-[85vh] overflow-y-auto" (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between gap-3 p-5 border-b border-slate-100">
      <h2 class="text-base font-semibold text-slate-800 m-0">This product is not serviceable at this location.</h2>
      <button type="button" class="btn-icon !w-8 !h-8 shrink-0" aria-label="Close" (click)="dismiss()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="p-5">
      <ul class="list-none m-0 p-0 flex flex-col gap-3">
        @for (line of data.lines; track line.productId) {
          <li class="flex items-center justify-between gap-4 py-2 border-b border-slate-100 last:border-b-0">
            <div class="flex items-center gap-2 min-w-0">
              <i class="fa-solid fa-circle-exclamation text-rose-600"></i>
              <span class="font-medium text-slate-800 truncate">{{ nameFor(line.productId) }}</span>
            </div>
            <div class="flex gap-2 shrink-0">
              <button type="button" class="btn-outline !py-1.5 !px-3 text-xs" (click)="tryAnotherShop(line.productId)">
                Try Another Shop
              </button>
              <button type="button" class="text-xs font-medium text-rose-600 hover:underline px-1" (click)="remove(line.productId)">
                Remove
              </button>
            </div>
          </li>
        }
      </ul>
    </div>

    @if (allowAddressChange) {
      <div class="flex justify-end p-5 pt-0">
        <button type="button" class="btn-primary" (click)="changeAddress()">Choose a Different Address</button>
      </div>
    }
  </div>
</div>
