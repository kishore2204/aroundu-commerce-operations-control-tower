<div class="mb-5 flex items-center justify-between"><div><h1 class="text-2xl font-extrabold text-slate-900">Notifications</h1><p class="text-sm text-slate-500">Store and verification updates for your account.</p></div><button type="button" class="btn-outline" (click)="load()">Refresh</button></div>
@if (loading()) {<div class="flex justify-center py-10"><span class="spinner"></span></div>} @else if (notifications().length === 0) {<app-empty-state icon="notifications_none" title="No notifications"></app-empty-state>} @else {<div class="card"><ul class="divide-y divide-slate-100">@for(n of notifications(); track n.notificationId){<li class="py-4"><button type="button" class="w-full text-left" (click)="markRead(n)"><div class="flex justify-between gap-3"><span class="font-bold text-slate-900">{{n.title}}</span><span class="text-xs text-slate-400">{{n.sentAt | date:'short'}}</span></div><p class="mt-1 text-sm text-slate-600">{{n.message}}</p>@if(!n.read){<span class="mt-2 inline-block text-xs font-bold text-zepto-600">Mark as read</span>}</button></li>}</ul></div>}
