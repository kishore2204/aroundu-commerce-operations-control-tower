<h1 class="text-2xl font-bold text-slate-900 mb-4">Store management</h1>

@if (loading()) {
  <div class="flex justify-center py-12"><div class="spinner"></div></div>
} @else {
  <div class="card max-w-2xl">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <div class="form-group full-width">
          <label class="form-label req-mark">Business name</label>
          <input class="input" formControlName="businessName" />
        </div>
        <div class="form-group">
          <label class="form-label req-mark">City</label>
          <select class="select" formControlName="cityId" (change)="onCityChange($any($event.target).value)">
            <option value="">Select City</option>
            @for (c of cities(); track c.id) {
              <option [value]="c.id">{{ c.cityName }}</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Zone</label>
          <select class="select" formControlName="zoneId" [disabled]="!form.value.cityId || zonesLoading()">
            <option value="">{{ zonesLoading() ? 'Loading zones...' : 'Select Zone' }}</option>
            @for (z of zones(); track z.zoneId) {
              <option [value]="z.zoneId">{{ z.zoneName }}</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Shop registration number<app-field-hint field="registration" /></label>
          <input class="input" formControlName="registrationNumber" maxlength="25" [appFormatInput]="'registration'" />
          @if (registrationError(); as message) { <p class="mt-1 text-xs font-semibold text-rose-600">{{ message }}</p> }
        </div>
        <div class="form-group">
          <label class="form-label">GST number<app-field-hint field="gstin" /></label>
          <input class="input" formControlName="gstNumber" maxlength="15" [appFormatInput]="'gstin'" />
          @if (gstError(); as message) { <p class="mt-1 text-xs font-semibold text-rose-600">{{ message }}</p> }
        </div>
        <div class="form-group">
          <label class="form-label">Latitude</label>
          <input class="input" type="number" formControlName="latitude" />
        </div>
        <div class="form-group">
          <label class="form-label">Longitude</label>
          <input class="input" type="number" formControlName="longitude" />
        </div>
      </div>

      <h2 class="text-base font-semibold text-slate-900 mt-2 mb-2">Operating hours</h2>
      <label class="flex items-center gap-3 mb-3 cursor-pointer select-none">
        <span class="relative inline-block w-11 h-6">
          <input type="checkbox" formControlName="isOpen" class="peer sr-only" />
          <span class="absolute inset-0 rounded-full bg-slate-200 peer-checked:bg-zepto-600 transition-colors"></span>
          <span class="absolute left-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
        </span>
        <span class="text-sm text-slate-700">Store is currently open for orders</span>
      </label>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Opens at</label>
          <input class="input" type="time" formControlName="opensAt" />
        </div>
        <div class="form-group">
          <label class="form-label">Closes at</label>
          <input class="input" type="time" formControlName="closesAt" />
        </div>
      </div>

      @if (saveError()) {
        <p class="text-sm text-rose-600 mb-2">{{ saveError() }}</p>
      }
      @if (saved()) {
        <p class="text-sm text-emerald-600 mb-2">Saved.</p>
      }
      <button type="submit" class="btn-primary" [disabled]="form.invalid || saving()">
        Save changes
      </button>
    </form>
  </div>
}
