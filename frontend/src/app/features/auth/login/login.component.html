<div class="relative flex min-h-screen flex-col overflow-hidden bg-gradient-to-br from-zepto-700 via-indigo-700 to-violet-900">
 <div class="pointer-events-none absolute -right-24 -top-24 h-96 w-96 rounded-full bg-gradient-to-br from-white/10 to-violet-400/20 blur-3xl"></div>
 <div class="pointer-events-none absolute -left-32 bottom-0 h-80 w-80 rounded-full bg-gradient-to-br from-amber-300/15 to-rose-400/15 blur-3xl"></div>
 <div class="relative z-10 flex flex-1 items-center justify-center p-4">
  <div class="card w-full max-w-md p-8">
    <h1 class="text-center text-2xl font-extrabold text-slate-900">Sign in</h1>
    <p class="mt-1 text-center text-sm text-slate-500">Welcome back to AroundU</p>

    @if (sessionExpired()) {
      <p class="mt-4 rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm font-semibold text-amber-700">
        Your session expired. Please sign in again.
      </p>
    }
    @if (errorMessage()) {
      <p class="mt-4 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm font-semibold text-rose-600">
        {{ errorMessage() }}
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-5 space-y-4">
      <div>
        <label class="form-label req-mark">Email</label>
        <input class="input" type="email" formControlName="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
      </div>
      <div>
        <div class="flex items-center justify-between">
          <label class="form-label req-mark">Password</label>
          <a routerLink="/forgot-password" class="text-xs font-semibold text-zepto-600 hover:text-zepto-700">Forgot password?</a>
        </div>
        <div class="relative">
          <input [type]="showPassword() ? 'text' : 'password'" class="input !pr-11" formControlName="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" />
          <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-zepto-600" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            <i class="fa-solid" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
          </button>
        </div>
      </div>
      <button class="btn-primary w-full" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner h-5 w-5 border-2 border-white/40 border-t-white"></span>
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-slate-600">
      New to AroundU? <a routerLink="/register" class="font-bold text-zepto-600 hover:text-zepto-700">Create an account</a>
    </p>
  </div>
 </div>
 <footer class="border-t border-white/10 px-4 py-5 text-center text-xs font-medium text-white/60">
   &copy; {{ currentYear }} AroundU &middot; Local Logistics &amp; Hyperlocal Retail Platform
 </footer>
</div>
