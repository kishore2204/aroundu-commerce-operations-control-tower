<div class="min-h-screen bg-slate-50 flex">
  <!-- Mobile overlay -->
  <div
    *ngIf="sidebarOpen()"
    class="fixed inset-0 bg-black/40 z-30 lg:hidden"
    (click)="closeSidebar()"
  ></div>

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-40 bg-zepto-800 text-zepto-100 flex flex-col transform transition-all duration-200 lg:translate-x-0 lg:sticky lg:top-0 lg:h-screen"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
    [class.w-64]="!collapsed()"
    [class.w-[72px]]="collapsed()"
  >
    <div class="flex items-center gap-2.5 px-5 py-5 border-b border-white/10">
      <span class="brandmark !h-9 !w-9 !rotate-0 !text-base">A</span>
      @if (!collapsed()) {
        <span class="text-white font-bold text-lg">AroundU</span>
        <span class="ml-auto text-[10px] font-semibold uppercase tracking-wide bg-white/10 text-zepto-100 px-2 py-0.5 rounded-full">Driver</span>
      }
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="bg-gradient-to-r from-zepto-600 to-violet-600 text-white shadow-glow"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zepto-100 hover:bg-white/10 transition-colors"
        [class.justify-center]="collapsed()"
        [title]="collapsed() ? item.label : ''"
        (click)="closeSidebar()"
      >
        <i class="fa-solid {{ item.icon }} w-5 text-center"></i>
        @if (!collapsed()) {
          <span>{{ item.label }}</span>
        }
      </a>
    </nav>

    <div class="px-3 py-2 border-t border-white/10">
      <button
        type="button"
        (click)="toggleCollapsed()"
        class="hidden lg:flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium text-zepto-100 hover:bg-white/10 transition-colors"
        [class.justify-center]="collapsed()"
        aria-label="Toggle sidebar width"
      >
        <i class="fa-solid" [class.fa-angles-left]="!collapsed()" [class.fa-angles-right]="collapsed()"></i>
        @if (!collapsed()) {
          <span>Collapse</span>
        }
      </button>
    </div>

    <div class="px-3 py-4 border-t border-white/10">
      <button
        type="button"
        (click)="logout()"
        class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium text-zepto-100 hover:bg-white/10 transition-colors"
        [class.justify-center]="collapsed()"
        [title]="collapsed() ? 'Log out' : ''"
      >
        <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
        @if (!collapsed()) {
          <span>Log out</span>
        }
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="sticky top-0 z-20 border-b border-slate-200/70 bg-white/85 backdrop-blur-xl flex items-center gap-3 px-4 sm:px-6 py-3">
      <button type="button" class="btn-icon lg:hidden" (click)="toggleSidebar()" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span class="font-semibold text-slate-800">Driver Console</span>
      <span class="flex-1"></span>

      <div class="relative">
        <button type="button" class="btn-icon" (click)="toggleAccountMenu()" aria-label="Account">
          <i class="fa-solid fa-circle-user text-xl text-zepto-600"></i>
        </button>
        @if (accountMenuOpen()) {
          <div class="dropdown-panel absolute right-0 mt-2 w-56 p-1.5 z-30">
            <div class="px-3 py-2 text-xs text-slate-500 truncate">{{ auth.email() }}</div>
            <button
              type="button"
              (click)="logout()"
              class="flex items-center gap-2 w-full px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-zepto-50"
            >
              <i class="fa-solid fa-right-from-bracket w-4 text-center"></i>
              <span>Log out</span>
            </button>
          </div>
        }
      </div>
    </header>

    <main class="flex-1 max-w-[1400px] w-full mx-auto px-4 sm:px-6 py-6">
      <router-outlet></router-outlet>
    </main>

    <footer class="border-t border-slate-100 px-4 sm:px-6 py-3 text-center text-xs text-slate-400">
      &copy; {{ currentYear }} AroundU &middot; Driver Portal
    </footer>
  </div>
</div>
