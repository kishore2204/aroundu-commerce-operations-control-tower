  <!--{{0}}--><template id="vehicles-1"><div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 p-4">

      <div class="flex items-start justify-between gap-4">

          <h3 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-file-circle-exclamation text-amber-500"></i> <!--{{0}}--></h3>

          <p class="text-xs text-slate-500 mt-2">Use the Re-upload Insurance action in the vehicle table. Only the rejected document needs to be replaced.</p>
        </div>
        <button type="button" class="btn-icon" onclick="Page.state.resubmissionNotice = null" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex justify-end mt-4"><button type="button" class="btn-primary" onclick="Page.state.resubmissionNotice = null">OK</button></div>
    </div>
  </div></template>

  <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Fleet Vehicles</h1>
      <p class="text-sm text-slate-500 mt-1">Manage delivery vehicles, capacity, and insurance documents</p>
    </div>
    <button type="button" class="btn-primary" onclick="Page.state.showForm = !Page.state.showForm">
      <i class="fa-solid {{1}}"></i>
      <!--{{2}}-->
    </button>
  </div>

  <!--{{3}}--><template id="vehicles-2"><div class="card mb-6">
    <h3 class="text-lg font-bold text-slate-900 mb-5"><i class="fa-solid fa-truck text-zepto-600"></i> Register Vehicle</h3>

    <!--{{0}}--><template id="vehicles-2-1"><div class="bg-rose-50 text-rose-700 rounded-lg px-3.5 py-2.5 mb-4 text-sm">
      <i class="fa-solid fa-triangle-exclamation"></i> <!--{{0}}-->
    </div></template>

    <form novalidate onsubmit="event.preventDefault(); Page.save()">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label req-mark">Registration Number<!--{{1}}--></label>
          <input type="text" class="input" name="registrationNumber" {{2}} placeholder="KA-01-AB-1234" maxlength="13" data-format-input="vehicle" autocapitalize="characters" spellcheck="false" autocomplete="off" />
          <!--{{3}}--><template id="vehicles-2-2"><p class="mt-1 text-xs font-semibold text-rose-600"><!--{{0}}--></p></template>
        </div>
        <div class="form-group">
          <label class="form-label req-mark">Vehicle Type</label>
          <select class="select" name="vehicleType" {{4}}>
            <option value="BIKE">BIKE (Two-Wheeler)</option>
            <option value="SCOOTER">SCOOTER</option>
            <option value="VAN">VAN (Cargo)</option>
            <option value="TRUCK">TRUCK (Light Commercial)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label req-mark">Make / Manufacturer</label>
          <input type="text" class="input" name="make" {{5}} placeholder="Honda, Hero, Tata..." />
        </div>
        <div class="form-group">
          <label class="form-label req-mark">Vehicle Model</label>
          <input type="text" class="input" name="model" {{6}} placeholder="Activa 6G, Splendor..." />
        </div>
        <div class="form-group">
          <label class="form-label req-mark">Model Year</label>
          <input type="number" class="input" min="1900" step="1" data-integer-only name="modelYear" {{7}} />
        </div>
        <div class="form-group">
          <label class="form-label req-mark">Payload Capacity (kg)<!--{{8}}--></label>
          <input type="number" class="input" name="capacityKg" {{9}} placeholder="50" />
        </div>
        <div class="form-group full-width">
          <label class="form-label req-mark">Insurance Document Photo / File</label>
          <input type="file" accept="image/*" class="input" onchange="Page.onInsuranceFileSelected(this)" />
          <!--{{10}}--><template id="vehicles-2-3"><div class="flex items-center gap-3 mt-2">
            <img src="{{0}}" alt="Insurance Document" class="thumb-img" />
            <span class="text-emerald-600 text-sm">Photo selected</span>
          </div></template>
          <!--{{11}}--><template id="vehicles-2-4"><input type="text" class="input mt-1.5" name="insuranceDocumentUrl" {{0}} placeholder="Or enter image URL" /></template>
        </div>
      </div>

      <div class="flex justify-end gap-3">
        <button type="button" class="btn-outline" onclick="Page.state.showForm = false">Cancel</button>
        <button type="submit" class="btn-primary" {{12}}>
          <!--{{13}}--><template id="vehicles-2-5"><span><i class="fa-solid fa-check"></i> Register Vehicle</span></template>
          <!--{{14}}--><template id="vehicles-2-6"><span><i class="fa-solid fa-spinner fa-spin"></i> Registering...</span></template>
        </button>
      </div>
    </form>
  </div></template>

            <div class="text-xs text-slate-400"><!--{{4}}--> <!--{{5}}--></div>
          </td>
          <td><!--{{6}}--> kg</td>
          <td>
            <!--{{7}}--><template id="vehicles-5-1-1"><div>
              <!--{{0}}--><template id="vehicles-5-1-1-1"><img src="{{0}}" alt="Insurance" class="thumb-img" /></template>
              <!--{{1}}--><template id="vehicles-5-1-1-2"><span class="text-xs text-slate-400"><!--{{0}}--></span></template>
            </div></template>
            <!--{{8}}--><template id="vehicles-5-1-2"><span class="text-slate-400">-</span></template>
          </td>
          <td>
            <span class="badge{{9}}">
              <!--{{10}}-->
            </span>
          </td>
          <td>
            <!--{{11}}--><template id="vehicles-5-1-3">
              <div class="text-xs text-rose-600 mb-2 max-w-xs"><!--{{0}}--></div>
              <label class="btn-outline cursor-pointer{{1}}">
                <i class="fa-solid {{2}}"></i>
                <!--{{3}}-->
                <input type="file" class="hidden" accept="image/*,.pdf" {{4}} onchange="Page.onResubmitInsurance({{5}}, this)" />
              </label></template><template id="vehicles-5-1-4"><span class="text-xs text-slate-400">No re-upload requested</span></template>
          </td>
        </tr></template>
      </tbody>
    </table></template>
  </div>
</div><!--/tpl:vehicles--></app-fleet-vehicles><!--/tpl:page-outlet-->

<template id="toast"></template>
<template id="toast-2">
        <div class="fixed bottom-6 left-1/2 z-[100] -translate-x-1/2 flex items-center gap-3 rounded-xl px-5 py-3 text-sm font-semibold text-white shadow-card-hover animate-fade-in{{0}}" role="status" aria-live="{{1}}" data-key="toast-{{2}}">

          </button>
        </div>
      </template>
<!-- END common/toast/toast.html -->

<template id="field-hint">
      <app-field-hint><span class="relative inline-block align-middle" data-hint="{{0}}" onmouseenter="{{1}}.show()" onmouseleave="{{2}}.hide()" onkeydown="if (event.key === 'Escape') {{3}}.hide()">
        <button type="button" class="ml-1 inline-flex h-4 w-4 items-center justify-center rounded-full align-middle text-slate-400 transition-colors hover:text-violet-600 focus-visible:text-violet-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400"
          aria-label="{{4}}" aria-describedby="{{5}}" aria-expanded="{{6}}"
          onfocus="{{7}}.show()" onblur="{{8}}.hide()" onclick="{{9}}.onClick(event)">
          <i class="fa-solid fa-circle-info text-[0.8rem]" aria-hidden="true"></i>
        </button>
        <span role="tooltip" id="{{10}}"
          class="absolute z-50 w-64 max-w-[calc(100vw-1rem)] px-0 text-left{{11}}"
          style="left: {{12}}px;">
          <span class="block whitespace-pre-line rounded-lg bg-slate-900 px-3 py-2 text-xs font-normal normal-case leading-relaxed tracking-normal text-white shadow-lg"><!--{{13}}--></span>
        </span>
      </span></app-field-hint></template>
