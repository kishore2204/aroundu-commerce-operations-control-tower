          <i class="fa-solid {{3}}"></i>
        </button>
      </div>
    </div>
    <button type="button" class="btn-outline" onclick="Page.state.createdCredentials = null">Dismiss</button>
  </div></template>

    <form novalidate onsubmit="event.preventDefault(); Page.save()">
      <div class="form-grid">

        </div>
        <div class="form-group">
          <label class="form-label req-mark">Email Address<!--{{3}}--></label>
          <input type="email" class="input" name="email" {{4}} placeholder="driver@aroundu.com" />
          <!--{{5}}--><template id="drivers-3-2"><p class="drivers-text-4"><!--{{0}}--></p></template>
        </div>
        <div class="form-group">
          <label class="form-label req-mark">Temporary Password<!--{{6}}--></label>
          <div class="drivers-bar-4">
            <input type="{{7}}" class="input" name="password" {{8}} placeholder="Driver@123" />
            <button type="button" class="btn-icon" onclick="Page.state.showPassword = !Page.state.showPassword" aria-label="{{9}}">

        </div>
        <div class="form-group">

              <!--{{8}}-->
            </span>

                <!--{{3}}-->
                <input type="file" class="drivers-input-2" accept="image/*,.pdf" {{4}} onchange="Page.onResubmitLicense({{5}}, this)" />
              </label></template><template id="drivers-6-1-2"><span class="drivers-label-3">No re-upload requested</span></template>
          </td>
        </tr></template>
      </tbody>
    </table></template>
  </div>
</div><!--/tpl:drivers--></app-fleet-drivers><!--/tpl:page-outlet-->
