    <nav class="sidebar-nav">
      <!--{{3}}--><template id="sidebar-collapsible-3">

          <!--{{4}}--><template id="sidebar-collapsible-3-1"><span><!--{{0}}--></span></template>

      <span class="portal-header-title"><!--{{0}}--></span>

<!--{{0}}--><template id="profile-1"><div class="flex justify-center py-12"><div class="spinner"></div></div></template><template id="profile-2"><p class="text-sm text-slate-500">Could not load your driver profile.</p></template><template id="profile-3">

      <dd class="col-span-1 text-slate-900 sm:col-span-3"><!--{{2}}--></dd>
    </dl>
    <p class="text-xs text-slate-400 mb-4">Name and email can be updated by contacting your fleet owner.</p>

    <form novalidate onsubmit="event.preventDefault(); Page.save()">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label req-mark">License number<!--{{3}}--></label>

        </div>
        <div class="form-group">
          <label class="form-label req-mark">License expiry date</label>
          <input class="input" type="date" name="licenseExpiryDate" {{6}} />
        </div>
      </div>
      <!--{{7}}--><template id="profile-3-2"><p class="text-sm text-rose-600 mb-3"><!--{{0}}--></p></template>
      <!--{{8}}--><template id="profile-3-3"><p class="text-sm text-emerald-600 mb-3">Saved.</p></template>
      <button type="submit" class="btn-primary" {{9}}>
        Save changes
      </button>
    </form>
  </div></template><!--/tpl:profile--></app-driver-profile><!--/tpl:page-outlet-->

<template id="toast"></template>
<template id="toast-2">

            <i class="fa-solid fa-xmark" aria-hidden="true"></i>

<!-- END common/toast/toast.html -->

<template id="field-hint">

        <button type="button" class="ml-1 inline-flex h-4 w-4 items-center justify-center rounded-full align-middle text-slate-400 transition-colors hover:text-violet-600 focus-visible:text-violet-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400"
          aria-label="{{4}}" aria-describedby="{{5}}" aria-expanded="{{6}}"
          onfocus="{{7}}.show()" onblur="{{8}}.hide()" onclick="{{9}}.onClick(event)">
          <i class="fa-solid fa-circle-info text-[0.8rem]" aria-hidden="true"></i>
        </button>
        <span role="tooltip" id="{{10}}"
          class="absolute z-50 w-64 max-w-[calc(100vw-1rem)] px-0 text-left{{11}}"
