      <router-outlet></router-outlet><!--{{1}}--><!--tpl:page-outlet--><app-driver-dashboard><!--{{0}}--><!--tpl:dashboard (this page)--><div class="dashboard-box-16">

    </div>
    <button type="button" class="btn-outline" onclick="Page.loadDriverTrips()">
      <i class="fa-solid fa-rotate-right"></i> Refresh
    </button>
  </div>

  <!--{{2}}--><template id="dashboard-1"><div class="dashboard-bar-27"><span class="spinner"></span></div></template><template id="dashboard-2">

              <span class="dashboard-label-28">Order #<!--{{1}}--></span>
            </div>
            <span class="badge{{2}}">
              <!--{{3}}-->
            </span>
          </div>

          <!--{{4}}--><template id="dashboard-2-1-1">

              <!--{{0}}-->

              <!--{{1}}-->
            </h2></template>

            <div class="dashboard-bar-30">
              <span class="dashboard-label-29">
                <i class="fa-solid fa-clock"></i>
              </span>
              <div>
                <span class="dashboard-label-30">Planned Start</span>
                <span class="dashboard-label-31"><!--{{5}}--></span>
              </div>
            </div>
            <div class="dashboard-bar-30">
              <span class="dashboard-label-29">
                <i class="fa-solid fa-route"></i>
              </span>
              <div>
                <span class="dashboard-label-30">Distance</span>
                <span class="dashboard-label-31"><!--{{6}}--> km</span>
              </div>
            </div>
          </div>

          <!--{{7}}--><template id="dashboard-2-1-2">
            <div class="dashboard-panel-8">
              <h3 class="dashboard-subheading-3">
                <i class="fa-solid fa-camera dashboard-icon-9"></i> Step 1: Confirm Store Pickup
              </h3>
              <p class="dashboard-text-28">Upload pickup proof photo or package image before starting transit.</p>

              <form novalidate onsubmit="event.preventDefault(); Page.confirmPickup()" class="form-grid !mb-0">
                <div class="form-group full-width">
                  <label class="form-label req-mark dashboard-label-25">
                    <i class="fa-solid fa-cloud-arrow-up dashboard-icon-9"></i> Select Pickup Photo File
                  </label>
                  <input type="file" accept="image/*" onchange="Page.readImage(this, 'pickupImageBase64')" class="input" />
                  <!--{{0}}--><template id="dashboard-2-1-2-1">
                    <div class="dashboard-bar-28">
                      <img src="{{0}}" alt="Pickup Preview" class="dashboard-image" />
                      <span class="dashboard-label-24">Photo selected</span>
                    </div></template>
                </div>

                <div class="form-group full-width">
                  <label class="form-label">Additional Notes / Proof Text (Optional)</label>
                  <input class="input" name="proofOfPickupText" {{1}} placeholder="e.g. Package verified at Kirana Store" />
                </div>

                <button type="submit" class="btn-primary dashboard-button-8" {{2}}>
                  <!--{{3}}--><template id="dashboard-2-1-2-2"><i class="fa-solid fa-arrow-right"></i> Confirm Pickup &amp; Start Delivery </template>
                </button>
              </form>
            </div></template>

          <!--{{8}}--><template id="dashboard-2-1-3">

              <div class="dashboard-bar-29">
                <i class="fa-solid fa-circle-check"></i>
                <div class="dashboard-bar-30">

                  <!--{{0}}--><template id="dashboard-2-1-3-1-1"><img src="{{0}}" alt="Recorded Pickup Proof" class="dashboard-image-2" /></template><template id="dashboard-2-1-3-1-2"><strong><!--{{0}}--></strong></template>
                </div>
              </div></template>

            <div class="dashboard-panel-9">
              <h3 class="dashboard-subheading-3">
                <i class="fa-solid fa-circle-check dashboard-icon-9"></i> Step 2: Submit Customer Delivery Proof
              </h3>
              <p class="dashboard-text-28">Upload delivery proof photo or customer doorstep confirmation image to complete this trip.</p>

              <form novalidate onsubmit="event.preventDefault(); Page.completeDelivery()" class="form-grid !mb-0">
                <div class="form-group full-width">
                  <label class="form-label req-mark dashboard-label-25">
                    <i class="fa-solid fa-cloud-arrow-up dashboard-icon-9"></i> Select Delivery Photo File

                <div class="form-group full-width">
                  <label class="form-label">Additional Notes / Proof Text (Optional)</label>
                  <input class="input" name="proofOfDeliveryText" {{2}} placeholder="e.g. Delivered to customer at doorstep" />

                <button type="submit" class="btn-secondary dashboard-button-8" {{3}}>
                  <!--{{4}}--><template id="dashboard-2-1-3-3"><i class="fa-solid fa-shield-check"></i> Upload Proof &amp; Complete Trip </template>
                </button>
              </form>
            </div></template>
        </div>
      </div></template><template id="dashboard-2-2">

    <div class="dashboard-grid-14">
      <div>
        <div class="dashboard-bar-33">

        </div>
        <div class="card">
          <p class="dashboard-text-32">Record fuel, toll, or other trip expenses - these show up in your fleet owner's expenses list for approval.</p>
          <form novalidate onsubmit="event.preventDefault(); Page.addExpense()" class="form-grid !mb-0">
            <div class="form-group">
              <label class="form-label req-mark">Expense Type</label>
              <select class="select" name="expenseType" {{5}}>

                <option value="MAINTENANCE">Maintenance</option>
                <option value="OTHER">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label req-mark">Amount (₹)</label>
              <input class="input" type="number" min="0.01" max="10000" step="0.01" name="amount" {{6}} />
              <p class="dashboard-text-33">Maximum ₹10,000 per expense.</p>
              <!--{{7}}--><template id="dashboard-2-3"><p class="dashboard-text-29">Maximum allowed amount for one expense is ₹10,000.</p></template>

            <div class="form-group">
              <label class="form-label req-mark">Date</label>
              <input class="input" type="date" name="expenseDate" {{8}} />
            </div>
            <div class="form-group full-width">
              <label class="form-label dashboard-label-25">
                <i class="fa-solid fa-receipt dashboard-icon-9"></i> Proof of Expense (receipt photo/PDF, optional)
              </label>
              <input type="file" accept="image/*,application/pdf" data-expense-proof onchange="Page.onExpenseProofFileSelected(this)" class="input" />
              <!--{{9}}--><template id="dashboard-2-4"><span class="dashboard-label-32"><!--{{0}}--> selected</span></template>
            </div>
            <div class="form-group full-width">
              <button type="submit" class="btn-primary" {{10}}>
                <!--{{11}}--><template id="dashboard-2-5"><i class="fa-solid fa-plus"></i> Add Expense </template>
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="dashboard-grid-15">
        <div class="card">
          <h2 class="dashboard-heading-10">Driver readiness</h2>
          <div class="dashboard-grid-16">
            <div class="dashboard-bar-34">
              <span class="dashboard-label-34"><i class="fa-solid fa-circle-check dashboard-icon-11"></i>Profile</span>
              <span class="dashboard-label-35"><!--{{12}}--></span>
            </div>
            <div class="dashboard-bar-34">
              <span class="dashboard-label-34"><i class="fa-solid fa-id-card dashboard-icon-11"></i>License</span>
              <span class="dashboard-label-36"><!--{{13}}--></span>

            <div class="dashboard-bar-35{{14}}">

              </span>
              <span class="dashboard-label-38{{16}}">
                <!--{{17}}-->
              </span>

          </div>
        </div>

        <!--{{18}}--><template id="dashboard-2-6">

            <h2 class="dashboard-heading-8">Recent trip</h2>
            <p class="dashboard-text-30"><!--{{0}}--> &middot; Order #<!--{{1}}--></p>
