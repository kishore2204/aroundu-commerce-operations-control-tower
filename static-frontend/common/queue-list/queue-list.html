<!--
  queue-list.html - markup of queue-list (Angular: src/app/features/location/queue-list/queue-list.component.html).
  A page cannot include another HTML file when it is opened from disk, so every page that uses this component
  contains a copy of these templates between "BEGIN common/queue-list/queue-list.html" and "END" comments.
  Values filled in by the JS are marked <!--{{n}}--> (content) and {{n}} (inside a tag).
-->
<template id="queue-list"><div class="queue-list-bar-2">
  <h1 class="queue-list-title">
    <span class="queue-list-label">
      <i class="fa-solid fa-clipboard-check queue-list-icon"></i>
    </span>
    Verification queue
  </h1>
  <!--{{0}}-->
</div>

<div class="form-group queue-list-box">
  <label class="form-label">Status</label>
  <select class="select" data-value="{{1}}" onchange="Page.setStatus(this.value)">
    <option value="SENT_TO_LOCATION_MANAGER">Awaiting my review</option>
    <option value="DOCUMENTS_SUBMITTED">Documents submitted (not yet sent)</option>
    <option value="RESUBMISSION_REQUIRED">Waiting for document re-upload</option>
    <option value="APPROVED">Approved</option>
    <option value="REJECTED">Rejected</option>
    <option value="ALL">All entries</option>
  </select>
</div>

<div class="queue-list-bar-3">
  <i class="fa-solid fa-circle-info queue-list-icon-2"></i>
  <span>Use the <strong>Review</strong> action to open the application, inspect the submitted details and documents, and make a verification decision.</span>
</div>

<!--{{2}}--><template id="queue-list-1"><div class="queue-list-bar"><span class="spinner"></span></div></template><template id="queue-list-2">
  <div class="table-card overflow-x-auto">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Submitted</th>
          <th>Status</th>
          <th class="queue-list-cell-2">Action</th>
        </tr>
      </thead>
      <tbody>
        <!--{{0}}--><template id="queue-list-2-1">
          <tr class="queue-list-row" onclick="Nav.open({{0}})" data-key="{{1}}">
            <td>
              <p class="queue-list-text">
                <!--{{2}}-->
              </p>
              <p class="queue-list-text-2">
                <!--{{3}}-->
                <!--{{4}}--><template id="queue-list-2-1-1"> &middot; Fleet: <!--{{0}}--> </template>
              </p>
            </td>
            <td class="queue-list-cell"><!--{{5}}--></td>
            <td>
              <span class="badge{{6}}">
                <!--{{7}}-->
              </span>
            </td>
            <td class="queue-list-cell-2">
              <a class="btn-outline queue-list-link" href="{{8}}" onclick="event.stopPropagation()">
                Review <i class="fa-solid fa-arrow-right"></i>
              </a>
            </td>
          </tr></template>
      </tbody>
    </table>
  </div></template></template>
