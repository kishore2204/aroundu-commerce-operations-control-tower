<!--
  confirm-dialog.html - markup of confirm-dialog (Angular: src/app/shared/confirm-dialog/confirm-dialog.component.html).
  A page cannot include another HTML file when it is opened from disk, so every page that uses this component
  contains a copy of these templates between "BEGIN common/confirm-dialog/confirm-dialog.html" and "END" comments.
  Values filled in by the JS are marked <!--{{n}}--> (content) and {{n}} (inside a tag).
-->
<template id="confirm-dialog">
      <app-confirm-dialog><div class="confirm-dialog-overlay">
        <div class="card confirm-dialog-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
          <div class="confirm-dialog-bar">
            <span class="confirm-dialog-label-2{{0}}">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </span>
            <div class="confirm-dialog-box-2">
              <h2 id="confirm-dialog-title" class="confirm-dialog-heading"><!--{{1}}--></h2>
              <p id="confirm-dialog-message" class="confirm-dialog-text"><!--{{2}}--></p>
            </div>
          </div>
          <div class="confirm-dialog-bar-2">
            <button type="button" class="btn-outline" data-confirm-cancel="{{3}}" {{4}} onclick="U.$('{{5}}').opts.onCancel()"><!--{{6}}--></button>
            <button type="button" class="btn-primary{{7}}"
              {{8}} onclick="U.$('{{9}}').opts.onConfirm()">
              <!--{{10}}--><template id="confirm-dialog-1"><span class="spinner confirm-dialog-label"></span> <!--{{0}}--></template><template id="confirm-dialog-2"><!--{{0}}--></template>
            </button>
          </div>
        </div>
      </div></app-confirm-dialog></template>
