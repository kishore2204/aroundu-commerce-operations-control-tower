<!--
  document-history.html - markup of document-history (Angular: src/app/shared/document-history/document-history-dialog.component.html).
  A page cannot include another HTML file when it is opened from disk, so every page that uses this component
  contains a copy of these templates between "BEGIN common/document-history/document-history.html" and "END" comments.
  Values filled in by the JS are marked <!--{{n}}--> (content) and {{n}} (inside a tag).
-->

        </div>

                <tr><th>Version</th><th>Uploaded</th><th>Uploaded by</th><th>Status</th><th>Reviewed by</th><th>Reviewer comment / re-upload reason</th><th></th></tr>
              </thead>

                    <td class="document-history-cell-2"><!--{{3}}--></td>
                    <td><!--{{4}}--></td>
                    <td><span class="badge {{5}}"><!--{{6}}--></span></td>
                    <td><!--{{7}}--><!--{{8}}--><template id="document-history-dialog-4-1-2"><span class="document-history-label-2"><!--{{0}}--></span></template></td>
                    <td class="document-history-cell-3"><!--{{9}}--></td>
                    <td class="document-history-cell-4">
                      <button type="button" class="btn-outline document-history-button" {{10}} onclick="{{11}}.open({{12}}, false)"><i class="fa-solid fa-eye"></i> View</button>
                      <button type="button" class="btn-outline document-history-button" {{13}} onclick="{{14}}.open({{15}}, true)"><i class="fa-solid fa-file-arrow-down"></i> Download</button>
                    </td>

          </div>
