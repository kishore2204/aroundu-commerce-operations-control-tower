<!--
  document-history.html - markup of document-history (Angular: src/app/shared/document-history/document-history-dialog.component.html).
  A page cannot include another HTML file when it is opened from disk, so every page that uses this component
  contains a copy of these templates between "BEGIN common/document-history/document-history.html" and "END" comments.
  Values filled in by the JS are marked <!--{{n}}--> (content) and {{n}} (inside a tag).
-->
<template id="document-history-dialog"><app-document-history-dialog>
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
      <div class="card flex max-h-[90vh] w-full max-w-5xl flex-col" role="dialog" aria-modal="true" aria-labelledby="doc-history-title">
        <div class="flex items-start justify-between gap-3">
          <h2 id="doc-history-title" class="m-0 text-lg font-bold text-slate-900"><!--{{0}}--> - Document History</h2>
          <button type="button" class="btn-icon !h-8 !w-8 shrink-0" aria-label="Close" onclick="{{1}}.close()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!--{{2}}--><template id="document-history-dialog-1"><div class="flex justify-center py-10"><span class="spinner"></span></div></template><template id="document-history-dialog-2"><p class="mt-4 text-sm font-semibold text-rose-600"><!--{{0}}--></p></template><template id="document-history-dialog-3"><p class="mt-4 text-sm text-slate-500">No file has been uploaded for this document yet.</p></template><template id="document-history-dialog-4">
          <div class="table-card mt-4 overflow-auto">
            <table class="custom-table">
              <thead>
                <tr><th>Version</th><th>Uploaded</th><th>Uploaded by</th><th>Status</th><th>Reviewed by</th><th>Reviewer comment / re-upload reason</th><th></th></tr>
              </thead>
              <tbody>
                <!--{{0}}--><template id="document-history-dialog-4-1">
                  <tr data-key="{{0}}">
                    <td class="font-semibold text-slate-800">v<!--{{1}}--><!--{{2}}--><template id="document-history-dialog-4-1-1"><span class="ml-1 text-xs font-medium text-slate-400">(current)</span></template></td>
                    <td class="whitespace-nowrap text-slate-600"><!--{{3}}--></td>
                    <td><!--{{4}}--></td>
                    <td><span class="badge {{5}}"><!--{{6}}--></span></td>
                    <td><!--{{7}}--><!--{{8}}--><template id="document-history-dialog-4-1-2"><span class="block text-xs text-slate-400"><!--{{0}}--></span></template></td>
                    <td class="max-w-xs text-sm text-slate-600"><!--{{9}}--></td>
                    <td class="whitespace-nowrap">
                      <button type="button" class="btn-outline !px-2 !py-1 text-xs" {{10}} onclick="{{11}}.open({{12}}, false)"><i class="fa-solid fa-eye"></i> View</button>
                      <button type="button" class="btn-outline !px-2 !py-1 text-xs" {{13}} onclick="{{14}}.open({{15}}, true)"><i class="fa-solid fa-file-arrow-down"></i> Download</button>
                    </td>
                  </tr></template>
              </tbody>
            </table>
          </div>
          <!--{{1}}--><template id="document-history-dialog-4-2"><p class="mt-3 text-sm font-semibold text-rose-600"><!--{{0}}--></p></template></template>
      </div>
    </div>
  </app-document-history-dialog></template>
