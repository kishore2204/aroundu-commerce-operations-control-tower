<!--
  toast.html - markup of toast (Angular: src/app/shared/toast/toast.component.html).
  A page cannot include another HTML file when it is opened from disk, so every page that uses this component
  contains a copy of these templates between "BEGIN common/toast/toast.html" and "END" comments.
  Values filled in by the JS are marked <!--{{n}}--> (content) and {{n}} (inside a tag).
-->
<template id="toast"></template>
<template id="toast-2">
        <div class="toast-bar animate-fade-in{{0}}" role="status" aria-live="{{1}}" data-key="toast-{{2}}">
          <i class="fa-solid{{3}}" aria-hidden="true"></i>
          <span><!--{{4}}--></span>
          <button type="button" class="toast-button" onclick="Toast.dismiss()" aria-label="Dismiss notification">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
      </template>
