  <!-- AroundU static frontend - Customer - Commerce - login page, route /login (Angular: src/app/features/auth/login/login.component.html) -->
  <app-root data-pending><!--tpl:navigation-boot (common/navigation/navigation.html)--><router-outlet></router-outlet><!--{{0}}--><!--tpl:page-outlet--><app-login><!--{{0}}--><!--tpl:login (this page)-->
<div class="login-stack">
 <div class="login-panel"></div>
 <div class="login-panel-2"></div>
 <div class="login-bar">
  <div class="card login-box p-8">
    <h1 class="login-title">Sign in</h1>
    <p class="login-text-3">Welcome back to AroundU</p>

    <!--{{0}}--><template id="login-1">
      <p class="login-text">
        Your session expired. Please sign in again.
      </p></template>
    <!--{{1}}--><template id="login-2">
      <p class="login-text-2">
        <!--{{0}}-->
      </p></template>

    <form novalidate class="login-form" onsubmit="event.preventDefault(); Page.submit()">
      <div>
        <label class="form-label req-mark">Email</label>
        <input class="input" type="email" name="email" {{2}} autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
      </div>
      <div>
        <div class="login-bar-2">
          <label class="form-label req-mark">Password</label>
          <a href="{{3}}" class="login-link">Forgot password?</a>
        </div>
        <div class="login-box-2">
          <input type="{{4}}" class="input login-input" name="password" {{5}} autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" />
          <button type="button" class="login-button" onclick="Page.state.showPassword = !Page.state.showPassword" aria-label="{{6}}">
            <i class="fa-solid{{7}}"></i>
          </button>
        </div>
      </div>
      <button class="btn-primary login-button-2" type="submit" {{8}}>
        <!--{{9}}--><template id="login-3"><span class="spinner login-label"></span></template><template id="login-4">Sign in</template>
      </button>
    </form>

    <p class="login-text-4">
      New to AroundU? <a href="{{10}}" class="login-link-2">Create an account</a>
    </p>
  </div>
 </div>
 <footer class="login-footer">
   &copy; <!--{{11}}--> AroundU &middot; Local Logistics &amp; Hyperlocal Retail Platform
 </footer>
</div><!--/tpl:login--></app-login><!--/tpl:page-outlet--><app-toast><!--{{1}}--></app-toast><!--/tpl:navigation-boot--></app-root>
