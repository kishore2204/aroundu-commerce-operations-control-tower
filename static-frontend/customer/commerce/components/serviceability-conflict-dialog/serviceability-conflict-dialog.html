<!--
  serviceability-conflict-dialog.html - markup of serviceability-conflict-dialog (Angular: src/app/shared/serviceability-conflict-dialog/serviceability-conflict-dialog.component.html).
  A page cannot include another HTML file when it is opened from disk, so every page that uses this component
  contains a copy of these templates between "BEGIN customer/commerce/components/serviceability-conflict-dialog/serviceability-conflict-dialog.html" and "END" comments.
  Values filled in by the JS are marked <!--{{n}}--> (content) and {{n}} (inside a tag).
-->
<template id="serviceability-conflict-dialog">
      <app-serviceability-conflict-dialog><div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4" onclick="{{0}}.onClosed(undefined)">
        <div class="card w-full max-w-lg max-h-[85vh] overflow-y-auto" onclick="event.stopPropagation()">
          <div class="flex items-start justify-between gap-3 p-5 border-b border-slate-100">
            <h2 class="text-base font-semibold text-slate-800 m-0">This product is not serviceable at this location.</h2>
            <button type="button" class="btn-icon !w-8 !h-8 shrink-0" aria-label="Close" onclick="{{1}}.onClosed(undefined)">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="p-5">
            <ul class="list-none m-0 p-0 flex flex-col gap-3">
              <!--{{2}}--><template id="serviceability-conflict-dialog-1">
                <li class="flex items-center justify-between gap-4 py-2 border-b border-slate-100 last:border-b-0">
                  <div class="flex items-center gap-2 min-w-0">
                    <i class="fa-solid fa-circle-exclamation text-rose-600"></i>
                    <span class="font-medium text-slate-800 truncate"><!--{{0}}--></span>
                  </div>
                  <div class="flex gap-2 shrink-0">
                    <button type="button" class="btn-outline !py-1.5 !px-3 text-xs" onclick="{{1}}.onClosed({ type: 'try-another-shop', productId: {{2}} })">
                      Try Another Shop
                    </button>
                    <button type="button" class="text-xs font-medium text-rose-600 hover:underline px-1" onclick="{{3}}.onClosed({ type: 'remove', productId: {{4}} })">
                      Remove
                    </button>
                  </div>
                </li></template>
            </ul>
          </div>

          <!--{{3}}--><template id="serviceability-conflict-dialog-2">
            <div class="flex justify-end p-5 pt-0">
              <button type="button" class="btn-primary" onclick="{{0}}.onClosed({ type: 'change-address' })">Choose a Different Address</button>
            </div></template>
        </div>
      </div></app-serviceability-conflict-dialog></template>
