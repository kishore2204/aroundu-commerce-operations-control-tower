<!--{{2}}--><template id="catalogue-3">

          <select class="select" name="categoryId" {{4}}>
            <!--{{5}}--><template id="catalogue-3-1"><option value="{{0}}" disabled>Current category (no longer active)</option></template>
            <!--{{6}}--><template id="catalogue-3-2"><option value="{{0}}"><!--{{1}}--></option></template>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label req-mark">Unit price<!--{{7}}--></label>
          <input class="input" type="number" name="unitPrice" {{8}} step="0.01" />
        </div>
        <!--{{9}}--><template id="catalogue-3-3">
          <div class="form-group">
            <label class="form-label req-mark">Initial stock<!--{{0}}--></label>
            <input class="input" type="number" min="0" step="1" data-integer-only name="stock" {{1}} />
          </div></template>
        <div class="form-group">
          <label class="form-label req-mark">Status</label>
          <select class="select" name="status" {{10}}>
            <option value="ACTIVE">Active</option>
            <option value="DRAFT">Draft</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label class="form-label req-mark">Description</label>
          <textarea class="input" name="description" rows="3" oninput="{{11}}.controls['description'].input(this)" onblur="{{12}}.controls['description'].blur()"><!--{{13}}--></textarea>
          <span class="text-xs text-slate-400">10-300 characters</span>
        </div>
        <div class="form-group">
          <label class="form-label">Low stock threshold (optional)<!--{{14}}--></label>

        <div class="form-group">
          <label class="form-label">Weight (kg) (optional)<!--{{16}}--></label>
