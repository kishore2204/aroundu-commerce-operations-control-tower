<app-retailer-shell>
<div class="portal-layout">
  <!--{{0}}--><!--tpl:sidebar-collapsible (common/sidebar/sidebar.html)-->
  <!--{{0}}--><template id="sidebar-collapsible-1"><div class="sidebar-overlay" onclick="PortalShell.closeSidebar()"></div></template>

  <aside class="sidebar{{1}}">
    <div class="sidebar-brand">
      <span class="brandmark sidebar-brandmark">A</span>
      <!--{{2}}--><template id="sidebar-collapsible-2">
        <span class="sidebar-brand-name">AroundU</span>
        <span class="sidebar-badge"><!--{{0}}--></span></template>
    </div>

    <nav class="sidebar-nav">
      <!--{{3}}--><template id="sidebar-collapsible-3">
        <a href="{{0}}"
          class="sidebar-link{{1}}"
          title="{{2}}" onclick="PortalShell.closeSidebar()">
          <i class="fa-solid {{3}} sidebar-icon"></i>
          <!--{{4}}--><template id="sidebar-collapsible-3-1"><span><!--{{0}}--></span></template>
        </a></template>
    </nav>

    <div class="sidebar-collapse-section">
      <button type="button" onclick="PortalShell.toggleCollapsed()"
        class="sidebar-collapse-button{{4}}" aria-label="Toggle sidebar width">
        <i class="fa-solid{{5}}"></i>
        <!--{{6}}--><template id="sidebar-collapsible-4"><span>Collapse</span></template>
      </button>
    </div>

    <div class="sidebar-logout-section">
      <button type="button" onclick="PortalShell.logout()"
        class="sidebar-logout{{7}}" title="{{8}}">
        <i class="fa-solid fa-right-from-bracket sidebar-icon"></i>
        <!--{{9}}--><template id="sidebar-collapsible-5"><span>Log out</span></template>
      </button>
    </div>
  </aside><!--/tpl:sidebar-collapsible-->

  <!--{{1}}--><!--tpl:portal-shell-main (common/portal-shell/portal-shell.html)-->
  <div class="portal-content">
    <!--{{0}}--><!--tpl:portal-header (common/portal-header/portal-header.html)-->
    <header class="portal-header">
      <button type="button" class="btn-icon portal-header-menu-button" onclick="PortalShell.toggleSidebar()" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span class="portal-header-title"><!--{{0}}--></span>
      <!--{{1}}--><template id="portal-header-1">
        <span class="portal-header-territory">
          <i class="fa-solid fa-map-location-dot portal-header-territory-icon"></i> <!--{{0}}-->
        </span></template>
      <span class="portal-header-spacer"></span>

      <div class="portal-header-account">
        <button type="button" class="btn-icon" onclick="PortalShell.toggleAccountMenu()" aria-label="Account">
          <i class="fa-solid fa-circle-user portal-header-account-icon"></i>
        </button>
        <!--{{2}}--><template id="portal-header-2">
          <div class="dropdown-panel portal-header-menu">
            <div class="portal-header-email"><!--{{0}}--></div>
            <!--{{1}}--><template id="portal-header-2-1">
              <a href="{{0}}" class="portal-header-menu-link" onclick="PortalShell.state.accountMenuOpen = false">
                <i class="fa-solid fa-shield-halved portal-header-menu-icon"></i>
                <span>Verification status</span>
              </a></template>
            <button type="button" onclick="PortalShell.logout()" class="portal-header-logout">
              <i class="fa-solid fa-right-from-bracket portal-header-menu-icon"></i>
              <span>Log out</span>

          </div></template>

    </header><!--/tpl:portal-header-->

    <main class="portal-main">
      <router-outlet></router-outlet><!--{{1}}--><!--tpl:page-outlet--><app-user-support><!--{{0}}--><!--tpl:user-support (common/user-support/user-support.html)--><div class="user-support-box"><h1 class="user-support-title">Support</h1><p class="user-support-text">Raise and track support requests for your account.</p></div>
<div class="card"><!--{{0}}--></div><!--/tpl:user-support--></app-user-support><!--/tpl:page-outlet-->
    </main>

    <!--{{2}}--><!--tpl:portal-footer (common/portal-footer/portal-footer.html)-->
    <footer class="portal-footer">
      &copy; <!--{{0}}--> AroundU &middot; <!--{{1}}-->
    </footer><!--/tpl:portal-footer-->
  </div><!--/tpl:portal-shell-main-->

<!-- BEGIN common/toast/toast.html -->
<template id="toast"></template>
<template id="toast-2">

        </div>
      </template>

<!-- BEGIN common/empty-state/empty-state.html -->
<template id="empty-state">

        <i class="icon text-5xl mb-3 opacity-60 fa-solid {{1}}"></i>
        <p class="title empty-state-text-2"><!--{{2}}--></p>
        <!--{{3}}--><template id="empty-state-1"><p class="subtitle mt-1 text-sm empty-state-text text-slate-400"><!--{{0}}--></p></template>
        <!--{{4}}-->

<!-- BEGIN common/my-tickets/my-tickets.html -->
<template id="my-tickets"><app-my-tickets><h1 class="my-tickets-title">Support</h1>

<!--{{0}}--><template id="my-tickets-1"><div class="my-tickets-bar"><div class="spinner"></div></div></template><template id="my-tickets-2">
  <!--{{0}}--><template id="my-tickets-2-1">
    <ul class="my-tickets-list">
      <!--{{0}}--><template id="my-tickets-2-1-1">
        <li data-key="{{0}}">
          <a href="{{1}}" class="my-tickets-link">
            <div>
              <p class="my-tickets-text"><!--{{2}}--> - <!--{{3}}--></p>
              <p class="my-tickets-text-2">
                <!--{{4}}--> / <!--{{5}}-->
                - <!--{{6}}-->
              </p>
            </div>
            <span class="badge{{7}}"><!--{{8}}--></span>
          </a>
        </li></template>
    </ul></template>

  <!--{{1}}--><template id="my-tickets-2-2">
    <div class="card">
      <form novalidate onsubmit="event.preventDefault(); {{0}}.submit()" class="my-tickets-form">
        <div>
          <label class="form-label req-mark">Category</label>
          <select class="select" name="ticketCategory" {{1}}>
            <option value="" disabled>Select a category</option>
            <!--{{2}}--><template id="my-tickets-2-2-1"><option value="{{0}}"><!--{{1}}--></option></template>
          </select>
        </div>
        <div>
          <label class="form-label req-mark">Subcategory</label>
          <select class="select" name="ticketSubCategory" {{3}}>
            <option value="" disabled>Select a subcategory</option>
            <!--{{4}}--><template id="my-tickets-2-2-2"><option value="{{0}}"><!--{{1}}--></option></template>
          </select>
        </div>
        <!--{{5}}--><template id="my-tickets-2-2-3">
          <div>
            <label class="form-label">Which order is this about? (optional)</label>
            <select class="select" name="orderId" {{0}}>
              <option value="">Not linked to a specific order</option>
              <!--{{1}}--><template id="my-tickets-2-2-3-1"><option value="{{0}}"><!--{{1}}--> - <!--{{2}}--></option></template>
            </select>
          </div></template>
        <div>
          <label class="form-label req-mark">Priority</label>
          <select class="select" name="priority" {{6}}>
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
          </select>
        </div>
        <div>
          <label class="form-label req-mark">Subject</label>
          <input class="input" type="text" name="subject" {{7}} />
        </div>
        <div>
          <label class="form-label req-mark">Description</label>
          <textarea class="input" name="description" rows="3" oninput="{{8}}.controls['description'].input(this)" onblur="{{9}}.controls['description'].blur()"><!--{{10}}--></textarea>
        </div>
        <!--{{11}}--><template id="my-tickets-2-2-4"><p class="my-tickets-text-3"><!--{{0}}--></p></template>
        <button type="submit" class="btn-primary my-tickets-button" {{12}}>Submit ticket</button>
      </form>
    </div></template><template id="my-tickets-2-3">
    <button type="button" class="btn-outline" onclick="{{0}}.openForm()">Raise a support ticket</button></template></template></app-my-tickets></template>
<!-- END common/my-tickets/my-tickets.html -->
