<!--{{0}}--><template id="inventory-1">

    <!--{{0}}-->
  </div></template>

<!--{{1}}--><template id="inventory-2">

    <!--{{0}}-->
    <!--{{1}}-->
    <!--{{2}}-->
    <!--{{3}}-->

<div class="inventory-bar-3">

  </div>
  <select class="select inventory-select" name="status" data-value="{{3}}" onchange="Page.statusChanged(this.value)">

    <option value="HEALTHY">Healthy</option>
    <option value="LOW_STOCK">Low stock</option>
    <option value="OUT_OF_STOCK">Out of stock</option>
  </select>
</div>

<!--{{4}}--><template id="inventory-3"><div class="inventory-bar"><div class="spinner"></div></div></template><template id="inventory-4">
  <div class="table-card">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Status</th>
          <th>Stock</th>
          <th>Adjust</th>
        </tr>
      </thead>
      <tbody>
        <!--{{0}}--><template id="inventory-4-1">
          <tr data-key="{{0}}">
            <td>
              <p class="inventory-text-3"><!--{{1}}--></p>
              <p class="inventory-text-4"><!--{{2}}--></p>
            </td>
            <td>
              <span class="badge{{3}}">
                <!--{{4}}-->
              </span>
            </td>
            <td class="inventory-cell"><!--{{5}}--> units</td>
            <td>
              <div class="inventory-bar-2">
                <input class="input inventory-input" type="number" min="1" step="1" data-integer-only value="{{6}}" oninput="Page.setQuantityFor({{7}}, this.value)" />

                  <i class="fa-solid fa-circle-plus inventory-icon"></i>
                </button>
                <button type="button" class="btn-icon" onclick="Page.adjust({{10}}, 'REMOVE_STOCK')" {{11}} aria-label="Remove stock">
                  <i class="fa-solid fa-circle-minus inventory-icon-2"></i>
                </button>
              </div>
            </td>
          </tr></template>

    </table>
  </div></template><!--/tpl:inventory--></app-retailer-inventory><!--/tpl:page-outlet-->
